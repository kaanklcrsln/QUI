name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata and build the plugin zip
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: qui-plugin-zip
          path: dist/*.zip
