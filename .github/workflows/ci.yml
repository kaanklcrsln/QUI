name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: QGIS 3.40 LTR, Qt5
            image: qgis/qgis:3.40
          - name: QGIS 4.2, Qt6
            image: qgis/qgis:4.2
    container: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          python3 -m pip install --break-system-packages pytest pytest-qgis pytest-qt \
            || python3 -m pip install pytest pytest-qgis pytest-qt
      - name: Probe user theme discovery (temporary diagnostic)
        shell: bash
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          from qgis.core import QgsApplication
          app = QgsApplication([], False)
          app.initQgis()
          folder = Path(QgsApplication.userThemesFolder())
          for name in ("ProbeBefore",):
              (folder / name).mkdir(parents=True, exist_ok=True)
              (folder / name / "style.qss").write_text("QWidget {}")
          before = "ProbeBefore" in QgsApplication.uiThemes()
          (folder / "ProbeAfter").mkdir(parents=True, exist_ok=True)
          (folder / "ProbeAfter" / "style.qss").write_text("QWidget {}")
          after = "ProbeAfter" in QgsApplication.uiThemes()
          print(f"::notice title=uiThemes probe::folder={folder} created-before-first-call listed={before}; created-after listed={after}")
          import shutil
          builtin = Path(QgsApplication.uiThemes()["Blend of Gray"])
          files = sorted(str(p.relative_to(builtin)) for p in builtin.rglob("*") if p.is_file() and "icons" not in p.parts)
          shutil.copytree(builtin, folder / "ProbeCopy", dirs_exist_ok=True)
          copied = "ProbeCopy" in QgsApplication.uiThemes()
          doc = (QgsApplication.uiThemes.__doc__ or "").replace("\n", " ")[:300]
          settings = QgsApplication.qgisSettingsDirPath()
          print(f"::notice title=uiThemes probe 2::builtin files={files}; copy listed={copied}; settings dir={settings}; doc={doc}")
          EOF
      - name: Run tests
        shell: bash
        run: |
          python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR; print('QGIS', Qgis.version(), 'Qt', QT_VERSION_STR)"
          set +e
          python3 -m pytest -q -rfE -W ignore::DeprecationWarning 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Annotations are readable without signing in, unlike job logs.
            summary=$(tail -n 60 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest failed (exit $status)::$summary"
          fi
          exit "$status"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: qui-plugin-zip
          path: dist/*.zip
